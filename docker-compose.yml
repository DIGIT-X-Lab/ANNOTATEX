version: '3.8'

services:
  annotatex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annotatex
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    volumes:
      # Optional: mount custom nginx config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - annotatex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  annotatex-network:
    driver: bridge
