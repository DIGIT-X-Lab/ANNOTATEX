name: gitleaks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: gitleaks.toml
          args: --source . --redact
